# //// Neoffice — added file (no upstream equivalent)
# Why: Neoffice serves the browser version of PdfCraft from its own build, and the maintainer's
# Mac has no disk left for a wasm build. This runs upstream's own packaging script
# (packaging/web/package.sh, the same one its release job runs) on a GitHub runner and keeps the
# zip with its SHA-256. Run it by hand from the Actions tab; upstream's workflows are disabled on
# this fork (they need upstream's signing secrets). Third-party actions are pinned by commit, as
# upstream does, and the fork only allows the ones listed in its Actions settings.
#
# With `release` ticked, the zip and its SHA256SUMS.txt are also published as a GitHub release
# (`web-<version>-<short sha>`): that is where the Suite's installer (suite/drive/wopi/craft_install.py)
# fetches the build from, pinned by its SHA-256. A plain run only keeps the artifact.
name: Neoffice web build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish the zip as a GitHub release (web-<version>-<short sha>)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  web:
    name: Web (wasm)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: neoffice-web
      # //// Neoffice — the interface translations are not in the repository since v0.19.0: they are an input of the build
      # (crates/ui-egui/build.rs reads CRAFT_I18N_DIR), at the commit craft-i18n.rev names. Without them the browser build's
      # interface is English only, whatever the language the hosting page names (`?lang=`). Upstream's release job does this
      # with its shared action (storytold/craft-common-actions, tracked at @main); this fork only allows the actions it lists,
      # so the same steps are written out. CRAFT_I18N_REQUIRED=1 makes a build without them fail.
      - name: Read craft-i18n.rev
        id: i18n
        run: |
          set -euo pipefail
          rev=$(tr -d '[:space:]' < craft-i18n.rev)
          if ! [[ "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=craft-i18n.rev::expected one 40-character craft-i18n commit SHA, found '$rev'"
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: Check out craft-i18n
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-i18n
          ref: ${{ steps.i18n.outputs.rev }}
          path: craft-i18n
      - name: Build with the interface translations
        run: |
          echo "CRAFT_I18N_DIR=${GITHUB_WORKSPACE}/craft-i18n" >> "$GITHUB_ENV"
          echo "CRAFT_I18N_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Install trunk 0.21.14 (SHA-256 pinned, as upstream's release job does)
        run: |
          set -euo pipefail
          url="https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/trunk.tar.gz" "$url"
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          tar -xz -C "$HOME/.cargo/bin" -f "$RUNNER_TEMP/trunk.tar.gz" trunk
          trunk --version
      - name: Build and zip
        # //// Neoffice — our product's name in the interface (crates/ui-egui/src/brand.rs). On this step only:
        # the test runs (neoffice-ci.yml) build without it and keep upstream's name.
        env:
          NEOFFICE_PRODUCT_NAME: NeoPDF
        run: packaging/web/package.sh
      # //// Neoffice — the zip must hold the translations our customers read: French, German, Spanish and Italian (a row of
      # each language's craft-i18n PdfCraft catalog, and one of our own rows, `i18n/neoffice/<code>.rs`: both are in the wasm
      # as the text of their strings). A build whose languages were dropped would still start, in English.
      - name: The interface languages are in the build
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          unzip -q dist/release/pdfcraft-web-*.zip -d "$work"
          # Two wasm files since 0.20: the editor and the OCR worker. The words are in the editor's, the larger.
          wasm=$(find "$work" -name '*.wasm' -exec ls -S {} + | head -n 1)
          test -n "$wasm"
          for word in "Aplatir les champs de formulaire" "Formularfelder reduzieren" "Acoplar campos de formulario" "Appiattisci campi modulo" \
                      "Demander à Nora" "Frag Nora" "Pregunta a Nora" "Chiedi a Nora"; do
            grep -q -a -F "$word" "$wasm" || { echo "::error::'$word' is not in $wasm: a language of the interface is missing"; exit 1; }
            echo "found: $word"
          done
          ls -l "$wasm" dist/release/pdfcraft-web-*.zip
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist/release
          sha256sum ./*.zip | tee SHA256SUMS.txt
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfcraft-web
          path: dist/release/*
          if-no-files-found: error
      - name: Publish the release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist/release
          zip_name=$(ls pdfcraft-web-*.zip)
          version=${zip_name#pdfcraft-web-}
          version=${version%.zip}
          tag="web-${version}-${GITHUB_SHA::7}"
          gh release create "$tag" "$zip_name" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Browser build ${version} (${GITHUB_SHA::7})" \
            --notes "Browser build of PdfCraft ${version} from commit ${GITHUB_SHA}. SHA-256 in SHA256SUMS.txt."
          echo "published $tag"

