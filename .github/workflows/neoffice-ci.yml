# //// Neoffice — added file (no upstream equivalent)
# Why: upstream's quality gate (`cargo xtask ci`: format, clippy without warnings, tests, layering,
# wasm, assets, cargo-deny, parity) is split over several jobs of its own workflow, one of which
# uses a third-party action that this fork's Actions settings refuse. This runs the whole gate in
# one job on a GitHub runner, by hand or on a push to version-15 that touches code. cargo-deny is
# installed from its release binary, checked against a pinned SHA-256. Upstream's workflows are
# disabled on this fork.
name: Neoffice CI

on:
  workflow_dispatch:
  push:
    branches: [version-15]
    paths: ["crates/**", "apps/**", "xtask/**", "Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/neoffice-ci.yml"]

permissions:
  contents: read

concurrency:
  group: neoffice-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts at the commit upstream's own CI uses (Japanese fonts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - name: Configure craft-fonts
        run: |
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Linux build dependencies (winit, wgpu, rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgtk-3-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: neoffice-ci
      - name: Install cargo-deny 0.20.2 (SHA-256 pinned)
        run: |
          set -euo pipefail
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/cargo-deny.tar.gz" "$url"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          tar -xz -C "$HOME/.cargo/bin" --strip-components=1 -f "$RUNNER_TEMP/cargo-deny.tar.gz" cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          cargo-deny --version
      - run: cargo xtask ci
